<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="scene.css">
  <style>
    .frame { display: grid; place-items: center; text-align: center; }
    .mark { width: 98px; height: 98px; margin: 0 auto 42px; font-size: 44px; animation: pop .7s cubic-bezier(.16,1,.3,1) both; }
    h1 { margin: 0; max-width: 1500px; font-size: 126px; }
    .tagline { margin-top: 24px; font-size: 40px; }
    .url { margin-top: 64px; padding: 20px 28px; color: white; background: var(--ink); font: 800 25px/1 ui-monospace, monospace; }
  </style>
</head>
<body>
  <main class="frame">
    <div>
      <div class="mark">M</div>
      <h1 class="rise-2">Meanwhile</h1>
      <div class="tagline rise-3">Side quests from your AI.</div>
      <div class="url rise-3">vaddisrinivas.github.io/meanwhile</div>
    </div>
  </main>
</body>
</html>
