<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="scene.css">
  <style>
    h1 { max-width: 1450px; }
    .grid { margin-top: 64px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .tile { min-height: 360px; padding: 38px; border: 2px solid var(--ink); background: var(--white); animation: rise .7s cubic-bezier(.16,1,.3,1) both; }
    .tile:nth-child(2) { animation-delay: .18s; background: var(--yellow); }
    .tile:nth-child(3) { animation-delay: .36s; color: white; background: var(--green); }
    .tile:nth-child(4) { animation-delay: .54s; color: white; background: var(--red); }
    .num { font: 900 22px/1 ui-monospace, monospace; }
    .tile h2 { margin: 120px 0 14px; font-size: 54px; }
    .tile p { margin: 0; font-size: 25px; line-height: 1.3; }
  </style>
</head>
<body>
  <main class="frame">
    <div class="kicker rise">A useful interval</div>
    <h1 class="rise-2">Learn. Reset. Play. Test.</h1>
    <section class="grid">
      <article class="tile"><span class="num">01</span><h2>Learn</h2><p>Follow the stack you are already using.</p></article>
      <article class="tile"><span class="num">02</span><h2>Reset</h2><p>Look away, move, return clearer.</p></article>
      <article class="tile"><span class="num">03</span><h2>Play</h2><p>Choose something finite, not a feed.</p></article>
      <article class="tile"><span class="num">04</span><h2>Test</h2><p>Use human taste where automation cannot.</p></article>
    </section>
  </main>
</body>
</html>
