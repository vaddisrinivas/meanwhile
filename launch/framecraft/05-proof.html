<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="scene.css">
  <style>
    .layout { height: 100%; display: grid; grid-template-columns: 650px 1fr; gap: 70px; align-items: center; }
    h1 { margin-top: 30px; font-size: 82px; }
    .stats { margin-top: 42px; display: flex; gap: 12px; }
    .stat { padding: 18px 22px; border: 2px solid var(--ink); background: var(--white); font: 900 24px/1 ui-monospace, monospace; }
    .browser { padding: 16px; border: 2px solid var(--ink); background: var(--ink); box-shadow: 22px 22px 0 var(--yellow); animation: pop .8s cubic-bezier(.16,1,.3,1) .25s both; }
    .chrome { height: 48px; padding: 0 16px; display: flex; align-items: center; gap: 10px; color: white; font: 18px/1 ui-monospace, monospace; }
    .dot { width: 14px; height: 14px; background: var(--red); }
    .dot:nth-child(2) { background: var(--yellow); }
    .dot:nth-child(3) { background: #72c7a4; }
    .url { margin-left: 16px; color: #d8dad5; }
    img { width: 100%; display: block; border: 0; }
  </style>
</head>
<body>
  <main class="frame">
    <section class="layout">
      <div>
        <div class="kicker rise">Open and curlable</div>
        <h1 class="rise-2">One skill.<br>One static catalogue.</h1>
        <div class="stats rise-3"><span class="stat">52 quests</span><span class="stat">7 packs</span></div>
      </div>
      <div class="browser">
        <div class="chrome"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="url">vaddisrinivas.github.io/meanwhile</span></div>
        <img src="site.png" alt="Meanwhile website">
      </div>
    </section>
  </main>
</body>
</html>
