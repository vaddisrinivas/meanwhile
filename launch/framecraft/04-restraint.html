<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="scene.css">
  <style>
    h1 { max-width: 1350px; font-size: 104px; }
    .rules { margin-top: 82px; display: flex; flex-wrap: wrap; gap: 18px; }
    .rule { min-width: 390px; padding: 28px 34px; border: 2px solid var(--ink); background: var(--white); font-size: 34px; font-weight: 900; animation: pop .65s cubic-bezier(.16,1,.3,1) both; }
    .rule:nth-child(2) { animation-delay: .18s; background: var(--yellow); }
    .rule:nth-child(3) { animation-delay: .36s; }
    .rule:nth-child(4) { animation-delay: .54s; color: white; background: var(--green); }
    .rule:nth-child(5) { animation-delay: .72s; color: white; background: var(--red); }
  </style>
</head>
<body>
  <main class="frame">
    <div class="kicker rise">Restraint is the feature</div>
    <h1 class="rise-2">Optional by design.</h1>
    <section class="rules">
      <div class="rule">Once per session</div>
      <div class="rule">One quest</div>
      <div class="rule">No account</div>
      <div class="rule">No streak</div>
      <div class="rule">No completion tracking</div>
    </section>
  </main>
</body>
</html>
