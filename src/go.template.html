<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Meanwhile — Opening</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
    body {
      min-height: 100vh; margin: 0; padding: 24px;
      display: grid; place-items: center;
      color: #171918; background: #f4f3ed;
    }
    main { max-width: 560px; }
    h1 { margin: 0 0 12px; font-size: clamp(36px, 8vw, 72px); line-height: .95; }
    p { color: #555852; line-height: 1.6; }
    a { color: inherit; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Opening…</h1>
    <p id="message">Finding the destination.</p>
    <a href="../">Browse the Meanwhile index</a>
  </main>
  <script type="application/json" id="redirect-map">
__REDIRECT_MAP__
  </script>
  <script>
    (() => {
      const redirects = JSON.parse(document.getElementById("redirect-map").textContent);
      const id = new URLSearchParams(location.search).get("id");
      const destination = id && redirects[id];
      if (destination) {
        location.replace(destination);
        return;
      }
      document.getElementById("title").textContent = "No destination found.";
      document.getElementById("message").textContent = id
        ? `“${id}” is not a redirectable catalogue entry.`
        : "Add an id query parameter, such as ?id=chess-storm.";
    })();
  </script>
</body>
</html>
