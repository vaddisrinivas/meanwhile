<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Turn a Meanwhile side quest into a simple share card.">
  <meta name="robots" content="noindex">
  <title>Share a side quest | Meanwhile</title>
  <style>
    :root { --ink:#171918; --paper:#f4f3ed; --white:#fffefa; --line:#d5d4cc; --red:#ed4b35; --yellow:#f1ca4b; --green:#267a58; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font:15px/1.5 Arial,Helvetica,sans-serif; }
    button,input,select,textarea { color:inherit; font:inherit; }
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:3px solid rgba(237,75,53,.3); outline-offset:2px; }
    header { height:58px; padding:0 max(18px,4vw); display:flex; align-items:center; justify-content:space-between; color:white; background:var(--ink); }
    .brand { display:flex; align-items:center; gap:10px; color:white; font-size:13px; font-weight:900; text-decoration:none; }
    .mark { width:28px; height:28px; display:grid; place-items:center; color:var(--ink); background:var(--yellow); font:800 15px ui-monospace,monospace; }
    header>a:last-child { color:#d8dad5; font-size:12px; }
    main { max-width:1280px; margin:auto; padding:54px max(18px,4vw) 80px; }
    .eyebrow { color:var(--red); font:800 10px ui-monospace,monospace; text-transform:uppercase; }
    h1 { max-width:760px; margin:10px 0 34px; font-size:clamp(42px,6vw,72px); line-height:.98; }
    .layout { display:grid; grid-template-columns:minmax(260px,340px) minmax(0,1fr); gap:42px; align-items:start; }
    form { display:grid; gap:18px; }
    label { display:grid; gap:7px; color:#62655f; font:10px ui-monospace,monospace; text-transform:uppercase; }
    input,select,textarea { width:100%; padding:12px; border:1px solid var(--line); border-radius:0; background:var(--white); font:14px/1.4 Arial,Helvetica,sans-serif; text-transform:none; }
    textarea { min-height:112px; resize:vertical; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
    button { min-height:44px; padding:0 15px; cursor:pointer; border:1px solid var(--ink); background:var(--ink); color:white; font-weight:800; }
    button.secondary { color:var(--ink); background:transparent; }
    #status { min-height:22px; color:#62655f; font-size:12px; }
    .poster { aspect-ratio:1200/630; min-width:0; padding:clamp(22px,4vw,58px); position:relative; overflow:hidden; color:white; background:var(--ink); border-top:10px solid var(--yellow); display:flex; flex-direction:column; }
    .poster-brand { color:var(--yellow); font:800 clamp(9px,1.2vw,15px) ui-monospace,monospace; }
    .poster h2 { max-width:90%; margin:auto 0 12px; font-size:clamp(28px,4.5vw,68px); line-height:.96; overflow-wrap:anywhere; }
    .poster p { max-width:82%; margin:0; color:#c9ccc7; font-size:clamp(12px,1.7vw,24px); line-height:1.35; }
    .result { margin-top:clamp(12px,2.5vw,28px)!important; padding-left:14px; border-left:3px solid var(--red); color:white!important; }
    .poster-foot { margin-top:auto; padding-top:22px; display:flex; justify-content:space-between; gap:16px; color:#9fa29d; font:700 clamp(8px,1vw,12px) ui-monospace,monospace; text-transform:uppercase; }
    @media(max-width:800px) { .layout{grid-template-columns:1fr}.poster{order:-1}main{padding-top:40px} }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="../"><span class="mark">M</span><span>MEANWHILE</span></a>
    <a href="../">Browse side quests</a>
  </header>
  <main>
    <div class="eyebrow">Optional share card</div>
    <h1>Keep the result. Share the moment.</h1>
    <div class="layout">
      <form id="form">
        <label>Side quest<select id="quest"></select></label>
        <label>Agent name<input id="model" maxlength="28" value="my AI"></label>
        <label>What happened<textarea id="result" maxlength="180" placeholder="Optional. One sentence is enough."></textarea></label>
        <div class="actions">
          <button type="button" id="share">Share link</button>
          <button type="button" id="download" class="secondary">Download PNG</button>
        </div>
        <div id="status" role="status"></div>
      </form>
      <section class="poster" id="poster" aria-label="Share card preview">
        <div class="poster-brand">MEANWHILE | SIDE QUEST</div>
        <h2 id="poster-title"></h2>
        <p id="poster-prompt"></p>
        <p class="result" id="poster-result" hidden></p>
        <div class="poster-foot"><span id="poster-model"></span><span>SIDE QUESTS FROM YOUR AI</span></div>
      </section>
    </div>
  </main>
  <script type="application/json" id="catalog">__LUNA_DATA__</script>
  <script>
    (() => {
      const data = JSON.parse(document.getElementById("catalog").textContent);
      const params = new URLSearchParams(location.search);
      const byId = Object.fromEntries(data.quests.map(quest => [quest.id, quest]));
      const questSelect = document.getElementById("quest");
      const modelInput = document.getElementById("model");
      const resultInput = document.getElementById("result");
      const clean = value => String(value || "").replace(/[<>]/g, "").trim();

      questSelect.replaceChildren(...data.quests.map(quest => {
        const option = document.createElement("option");
        option.value = quest.id;
        option.textContent = quest.title;
        return option;
      }));
      questSelect.value = byId[params.get("quest")] ? params.get("quest") : data.quests[0].id;
      modelInput.value = clean(params.get("model")) || "my AI";
      resultInput.value = clean(params.get("result")).slice(0, 180);

      function currentUrl() {
        const url = new URL(location.href);
        url.search = "";
        url.searchParams.set("quest", questSelect.value);
        if (clean(modelInput.value)) url.searchParams.set("model", clean(modelInput.value));
        if (clean(resultInput.value)) url.searchParams.set("result", clean(resultInput.value));
        return url;
      }

      function render() {
        const quest = byId[questSelect.value];
        const result = clean(resultInput.value);
        document.getElementById("poster-title").textContent = quest.title;
        document.getElementById("poster-prompt").textContent = quest.prompt;
        document.getElementById("poster-result").textContent = result;
        document.getElementById("poster-result").hidden = !result;
        document.getElementById("poster-model").textContent = `WHILE ${clean(modelInput.value) || "MY AI"} WORKED`;
        history.replaceState(null, "", currentUrl());
      }

      [questSelect, modelInput, resultInput].forEach(control => control.addEventListener("input", render));

      document.getElementById("share").onclick = async () => {
        const quest = byId[questSelect.value];
        const url = currentUrl().toString();
        const text = `My AI gave me a side quest: ${quest.title}`;
        try {
          if (navigator.share) await navigator.share({ title: "Meanwhile side quest", text, url });
          else { await navigator.clipboard.writeText(url); document.getElementById("status").textContent = "Link copied."; }
        } catch (error) {
          if (error.name !== "AbortError") document.getElementById("status").textContent = "Share was not available. The URL is ready in the address bar.";
        }
      };

      function wrap(ctx, text, maxWidth) {
        const words = text.split(/\s+/); const lines = []; let line = "";
        for (const word of words) {
          const next = line ? `${line} ${word}` : word;
          if (ctx.measureText(next).width > maxWidth && line) { lines.push(line); line = word; }
          else line = next;
        }
        if (line) lines.push(line);
        return lines;
      }

      document.getElementById("download").onclick = () => {
        const quest = byId[questSelect.value];
        const result = clean(resultInput.value);
        const canvas = document.createElement("canvas");
        canvas.width = 1200; canvas.height = 630;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#171918"; ctx.fillRect(0, 0, 1200, 630);
        ctx.fillStyle = "#f1ca4b"; ctx.fillRect(0, 0, 1200, 14);
        ctx.font = "700 24px Arial"; ctx.fillText("MEANWHILE | SIDE QUEST", 74, 78);
        ctx.fillStyle = "#ffffff"; ctx.font = "700 70px Arial";
        let y = 185;
        for (const line of wrap(ctx, quest.title, 1030).slice(0, 3)) { ctx.fillText(line, 74, y); y += 78; }
        ctx.fillStyle = "#c9ccc7"; ctx.font = "32px Arial";
        for (const line of wrap(ctx, quest.prompt, 930).slice(0, 3)) { ctx.fillText(line, 74, y); y += 42; }
        if (result) {
          ctx.fillStyle = "#ed4b35"; ctx.fillRect(74, y + 8, 5, 70);
          ctx.fillStyle = "#ffffff"; ctx.font = "700 28px Arial";
          for (const line of wrap(ctx, result, 900).slice(0, 2)) { ctx.fillText(line, 98, y + 36); y += 34; }
        }
        ctx.fillStyle = "#9fa29d"; ctx.font = "700 20px Arial";
        ctx.fillText(`WHILE ${(clean(modelInput.value) || "MY AI").toUpperCase()} WORKED`, 74, 582);
        ctx.textAlign = "right"; ctx.fillText("SIDE QUESTS FROM YOUR AI", 1126, 582);
        const link = document.createElement("a");
        link.download = `meanwhile-${quest.id}.png`; link.href = canvas.toDataURL("image/png"); link.click();
        document.getElementById("status").textContent = "PNG downloaded.";
      };
      render();
    })();
  </script>
</body>
</html>
