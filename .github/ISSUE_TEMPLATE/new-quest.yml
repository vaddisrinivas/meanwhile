name: Suggest an option
description: Propose one activity or destination for the Meanwhile catalogue.
title: "[Option]: "
labels: ["catalogue"]
body:
  - type: input
    id: title
    attributes:
      label: Title
      placeholder: Three minutes of chess
    validations:
      required: true
  - type: dropdown
    id: situation
    attributes:
      label: Best situation
      options:
        - Bored during a wait
        - Able to unblock Luna
        - Reality or proof needed
        - Personal judgment needed
        - Frustrated or restless
        - Curious and ready to learn
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Wait mode
      options:
        - Micro: 45 to 120 seconds, no tab
        - Journey: five-minute-or-longer wait
    validations:
      required: true
  - type: dropdown
    id: minutes
    attributes:
      label: Duration
      options: ["1", "3", "5", "10", "20"]
    validations:
      required: true
  - type: input
    id: contexts
    attributes:
      label: Task contexts
      description: Optional comma-separated tags such as oauth, compose, design, release, or recovery.
      placeholder: oauth, auth, security
  - type: input
    id: destination
    attributes:
      label: Direct destination
      description: Optional. Do not submit search, affiliate, referral, or shortened URLs.
      placeholder: https://example.com/activity
  - type: textarea
    id: prompt
    attributes:
      label: Invitation
      description: One natural sentence explaining what to do.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why this belongs
      description: Explain why it is better than an existing default.
    validations:
      required: true
